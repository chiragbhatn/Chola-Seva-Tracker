# Cloudflare Pages project settings for Chola Seva Tracker.
# Step 4 of README.md: paste your D1 database ID below before the first deploy.
name = "chola-seva"
pages_build_output_dir = "./public"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "chola-seva"
database_id = "PASTE-YOUR-D1-DATABASE-ID-HERE"
