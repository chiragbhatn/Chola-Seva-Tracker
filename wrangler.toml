# Cloudflare Worker settings for Chola Seva Tracker.
# The Worker serves the site in public/ and answers /api/* from src/worker.js.
# `name` must match the Worker's name in the Cloudflare dashboard.
name = "chola-seva"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Phone reminders (times in UTC; India is UTC+5:30). Must match PLAN_CRON and LOG_CRON in lib/push.js.
#   13:30 Mon/Fri = 7 pm India, the evening before each Hanuman day: tomorrow's plan to share.
#   14:30 Tue/Sat = 8 pm India, on the Hanuman day: a nudge if today's chola isn't logged yet.
[triggers]
crons = ["30 13 * * MON,FRI", "30 14 * * TUE,SAT"]

# The D1 database ID comes from step 1 of README.md (Storage & databases -> D1).
[[d1_databases]]
binding = "DB"
database_name = "chola-seva"
database_id = "07fe6888-fca7-443b-9ef5-d3b9e98df172"
