# Cloudflare Worker settings for Chola Seva Tracker.
# The Worker serves the site in public/ and answers /api/* from src/worker.js.
# `name` must match the Worker's name in the Cloudflare dashboard.
name = "chola-seva"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Phone reminders: 13:30 UTC = 7 pm India time, every Monday and Friday
# (the evening before each Tuesday and Saturday).
[triggers]
crons = ["30 13 * * MON,FRI"]

# The D1 database ID comes from step 1 of README.md (Storage & databases -> D1).
[[d1_databases]]
binding = "DB"
database_name = "chola-seva"
database_id = "07fe6888-fca7-443b-9ef5-d3b9e98df172"
